name: repro-foreach
on:
  workflow_dispatch:
jobs:
  typecheck:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: SDK info
        run: |
          xcodebuild -version
          xcrun -sdk iphonesimulator --show-sdk-version
      - name: Typecheck each variant
        run: |
          set +e
          PASS=0; FAILN=0
          for f in repro/*.swift; do
            if xcrun -sdk iphonesimulator swiftc -target arm64-apple-ios26.0-simulator -parse-as-library -typecheck "$f" 2>/tmp/err.txt; then
              echo "PASS  $f"; PASS=$((PASS+1))
            else
              echo "FAIL  $f"; FAILN=$((FAILN+1))
              head -4 /tmp/err.txt | sed 's/^/      /'
            fi
          done
          echo "RESULT: pass=$PASS fail=$FAILN"
