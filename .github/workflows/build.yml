name: Build IPAScope

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          else
            echo "Xcode_26.6.app not found; falling back to runner default"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Project
        run: |
          xcodegen generate
          ls -la

      - name: Build (unsigned IPA)
        run: |
          set +e
          xcodebuild -project IPAScope.xcodeproj \
            -scheme IPAScope \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -resultBundlePath build/Diag.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            IDEBuildOperationMaxNumberOfConcurrentCompileTasks=1 \
            build > /tmp/full_build.log 2>&1
          EX=$?
          echo "xcodebuild exit code: $EX"
          tail -300 /tmp/full_build.log
          exit $EX

      - name: Dump Diagnostics (failure forensics)
        if: failure()
        run: |
          set +e
          echo "===== 环境快照 ====="
          sysctl hw.memsize hw.ncpu 2>/dev/null
          vm_stat | head -6
          df -h / | tail -2
          echo ""
          echo "===== 完整日志中的全部 error 行（防 tail 截断）====="
          rg -n 'error:' /tmp/full_build.log | head -40 || echo "（完整日志中也无 error: 行）"
          echo ""
          echo "===== xcresulttool 官方结果包解析 ====="
          if [ -d build/Diag.xcresult ]; then
            xcrun xcresulttool get --legacy --format json --path build/Diag.xcresult > /tmp/xc_legacy.json 2>/tmp/xc_err.txt || true
            if [ -s /tmp/xc_legacy.json ]; then
              echo "legacy JSON 大小: $(wc -c < /tmp/xc_legacy.json)B — 提取 issue 节点:"
              python3 -c 'import json; d=json.load(open("/tmp/xc_legacy.json")); import sys; [print(json.dumps(x, ensure_ascii=False)[:800]) for x in [d]]; ' 2>/dev/null | head -30
              echo "---- 顶层结构:"
              python3 -c 'import json; d=json.load(open("/tmp/xc_legacy.json")); print(list(d.keys()) if isinstance(d,dict) else type(d))' 2>/dev/null
            else
              echo "legacy 接口无输出: $(head -2 /tmp/xc_err.txt)"
            fi
            echo ""
            echo "---- xcresulttool 新式接口尝试:"
            xcrun xcresulttool get test-results summary --path build/Diag.xcresult 2>&1 | head -15
          else
            echo "无结果包生成"
          fi
          echo ""
          echo "===== .dia 序列化诊断文本（strings 提取）====="
          find build -name "*.dia" -size +0 2>/dev/null | head -8 | while read f; do
            echo "--- $f ($(wc -c < $f)B)"
            strings "$f" | rg -i 'error|fatal|signal|Segmentation' | head -15
          done

      - name: Upload full build log + diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            /tmp/full_build.log
            build/Diag.xcresult
          if-no-files-found: ignore

      - name: Package IPA
        run: |
          ls build/Build/Products/Release-iphoneos/
          test -f build/Build/Products/Release-iphoneos/IPAScope.app/IPAScope || (echo "FATAL: 主二进制缺失（假成功防护）" && exit 1)
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/IPAScope.app Payload/
          zip -qry IPAScope-unsigned.ipa Payload
          unzip -t IPAScope-unsigned.ipa > /dev/null && echo "IPA CRC OK"
          ls -la IPAScope-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ipascope-ipa
          path: IPAScope-unsigned.ipa
          if-no-files-found: error
